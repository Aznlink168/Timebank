services:
  timebank:
    build: .
    container_name: timebank-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Persist database
      - ./timebank/database:/var/www/html/database
      # Persist storage (uploads, logs, etc.)
      - ./timebank/storage:/var/www/html/storage
      # Environment configuration
      - ./timebank/.env:/var/www/html/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - timebank-network

  # Optional: MySQL database (comment out if using SQLite)
  # mysql:
  #   image: mysql:8.0
  #   container_name: timebank-mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: timebank
  #     MYSQL_ROOT_PASSWORD: changeme
  #     MYSQL_USER: timebank
  #     MYSQL_PASSWORD: changeme
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   networks:
  #     - timebank-network

networks:
  timebank-network:
    driver: bridge

